<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaTutor — Debug & Learn</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="shell">

    <!-- sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-name">java<em>tutor</em></span>
      </div>

      <div class="model-block">
        <label class="field-label">modelo</label>
        <select id="model-select">
          <option value="llama3">llama3</option>
          <option value="codellama">codellama</option>
          <option value="mistral">mistral</option>
          <option value="deepseek-coder">deepseek-coder</option>
          <option value="phi3">phi3</option>
          <option value="gemma2">gemma2</option>
        </select>
      </div>

      <div class="model-block">
        <label class="field-label">endpoint</label>
        <input type="text" id="endpoint-input" value="http://localhost:11434" spellcheck="false" />
      </div>

      <div class="model-block">
        <label class="field-label">temperatura — <span id="temp-val">0.3</span></label>
        <input type="range" id="temp-slider" min="0" max="1" step="0.05" value="0.3" />
      </div>

      <div class="model-block">
        <label class="field-label">system prompt</label>
        <textarea id="system-prompt" rows="9">Eres un tutor de Java para nivel intermedio. Tu rol es identificar y explicar errores en código Java, indicando exactamente qué los causa y cómo corregirlos. Cuando el usuario pegue código con errores, señala la línea problemática, explica el motivo del fallo y proporciona la versión corregida. Si el concepto involucra un patrón recurrente (null pointer, cast incorrecto, ciclo infinito, etc.), menciona brevemente cómo evitarlo en el futuro. Responde siempre en español, de forma directa y sin rodeos.</textarea>
      </div>

      <div class="model-block">
        <label class="field-label">skills</label>
        <div class="skills-drop" id="skills-drop">
          <input type="file" id="skills-input" accept=".md" multiple hidden />
          <span class="skills-hint">seleccionar archivos .md</span>
        </div>
        <div class="skills-list" id="skills-list"></div>
      </div>

      <div class="sidebar-footer">
        <button id="clear-btn" class="ghost-btn">limpiar sesión</button>
        <button id="export-btn" class="ghost-btn">exportar</button>
      </div>
    </aside>

    <!-- panel principal -->
    <main class="panel">

      <div class="topbar">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">sin conexión</span>
        <button class="check-btn" id="check-btn">verificar</button>
        <span class="spacer"></span>
        <span class="token-counter" id="token-counter">0 tokens</span>
      </div>

      <div class="messages" id="messages">
        <div class="empty-state">
          <p class="empty-label">pega tu código Java o describe el error</p>
        </div>
      </div>

      <form class="compose" id="compose-form" autocomplete="off">
        <textarea
          id="input-box"
          class="input-box"
          placeholder="pega tu código o describe el problema..."
          rows="1"
          spellcheck="false"
        ></textarea>
        <button type="submit" class="send-btn" id="send-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>

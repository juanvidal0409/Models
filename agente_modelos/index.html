<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebForge — HTML & CSS Generator</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="shell">

    <!-- sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-name">web<em>forge</em></span>
      </div>

      <div class="model-block">
        <label class="field-label">modelo</label>
        <select id="model-select">
          <option value="llama3">llama3</option>
          <option value="codellama">codellama</option>
          <option value="mistral">mistral</option>
          <option value="deepseek-coder">deepseek-coder</option>
          <option value="phi3">phi3</option>
          <option value="gemma2">gemma2</option>
        </select>
      </div>

      <div class="model-block">
        <label class="field-label">endpoint</label>
        <input type="text" id="endpoint-input" value="http://localhost:11434" spellcheck="false" />
      </div>

      <div class="model-block">
        <label class="field-label">temperatura — <span id="temp-val">0.4</span></label>
        <input type="range" id="temp-slider" min="0" max="1" step="0.05" value="0.4" />
      </div>

      <div class="model-block">
        <label class="field-label">system prompt</label>
        <textarea id="system-prompt" rows="9">Eres un generador experto de código HTML y CSS. Tu único rol es producir código limpio, semántico y bien estructurado a partir de descripciones de componentes o páginas web. Cuando el usuario describa lo que quiere, responde SIEMPRE con dos bloques de código separados: primero el HTML (con etiqueta de lenguaje "html") y luego el CSS (con etiqueta "css"). No incluyas explicaciones largas, solo el código y un comentario breve al inicio si es necesario. Usa variables CSS custom properties, diseño responsive y buenas prácticas modernas. Nunca uses frameworks externos como Bootstrap. Responde siempre en español.</textarea>
      </div>

      <div class="model-block">
        <label class="field-label">skills</label>
        <div class="skills-drop" id="skills-drop">
          <input type="file" id="skills-input" accept=".md" multiple hidden />
          <span class="skills-hint">seleccionar archivos .md</span>
        </div>
        <div class="skills-list" id="skills-list"></div>
      </div>

      <div class="model-block">
        <label class="field-label">preview</label>
        <button id="preview-btn" class="ghost-btn accent-btn">▶ abrir preview</button>
      </div>

      <div class="sidebar-footer">
        <button id="clear-btn" class="ghost-btn">limpiar sesión</button>
        <button id="export-btn" class="ghost-btn">exportar chat</button>
        <button id="download-btn" class="ghost-btn">descargar HTML+CSS</button>
      </div>
    </aside>

    <!-- panel principal -->
    <main class="panel">

      <div class="topbar">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">sin conexión</span>
        <button class="check-btn" id="check-btn">verificar</button>
        <span class="spacer"></span>
        <span class="token-counter" id="token-counter">0 tokens</span>
      </div>

      <div class="messages" id="messages">
        <div class="empty-state">
          <p class="empty-label">describe el componente o página que quieres generar</p>
        </div>
      </div>

      <form class="compose" id="compose-form" autocomplete="off">
        <textarea
          id="input-box"
          class="input-box"
          placeholder="ej: una navbar responsive con logo a la izquierda y links a la derecha..."
          rows="1"
          spellcheck="false"
        ></textarea>
        <button type="submit" class="send-btn" id="send-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>

    </main>
  </div>

  <!-- modal de preview -->
  <div class="preview-modal" id="preview-modal" hidden>
    <div class="preview-header">
      <span class="preview-title">preview</span>
      <button id="preview-close" class="check-btn">✕ cerrar</button>
    </div>
    <iframe id="preview-frame" class="preview-frame"></iframe>
  </div>

  <script src="app.js"></script>
</body>
</html>
